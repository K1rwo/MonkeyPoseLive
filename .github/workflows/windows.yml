name: Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install desktop build dependencies
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-desktop.txt
      - name: Unit and packaging tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend offline tests
        run: node --test tests/test_frontend.cjs
      - name: Build portable app and run EXE headless self-test
        run: python build_windows.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: MonkeyPoseLive-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/MonkeyPoseLive/BUILD_MANIFEST.json
